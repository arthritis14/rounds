<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B0B0C" />
<title>Page not found · Rounds</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B0B0C; --field:#18181B; --ink:#F4F4F5; --muted:#8E8E96; --primary:#FF4B16; --primary-dim:#D63C0F; }
  @media (prefers-color-scheme: light){ :root{ --bg:#FAFAFA; --field:#F1F1F2; --ink:#0B0B0C; --muted:#6B6B73; } }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100dvh; background:var(--bg); color:var(--ink); font-family:'Geist', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing:antialiased; display:flex; justify-content:center; }
  main{ width:100%; max-width:430px; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:24px 24px calc(32px + env(safe-area-inset-bottom, 0px)); }
  img{ height:28px; width:auto; margin-bottom:48px; align-self:flex-start; }
  svg{ width:100%; max-width:260px; margin-bottom:32px; overflow:visible; }
  .code{ font-size:14px; font-weight:500; color:var(--primary); margin:0 0 10px; }
  h1{ font-size:34px; line-height:1.05; letter-spacing:-0.04em; font-weight:600; margin:0 0 12px; }
  p{ color:var(--muted); font-size:16px; line-height:1.5; margin:0 0 32px; max-width:30ch; }
  a.btn{ display:flex; align-items:center; justify-content:center; height:52px; border-radius:14px; background:var(--primary-dim); color:#fff; font-weight:600; font-size:15.5px; text-decoration:none; transition:transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
  a.btn:active{ transform:scale(.97); }
</style>
</head>
<body>
<main>
  <img src="/logo.webp" width="406" height="120" alt="Rounds">
  <svg viewBox="0 0 260 70" aria-hidden="true"><path d="M4 66 H60 V44 H120 V24 H160" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 24 H256" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/></svg>
  <p class="code">404</p>
  <h1>This round doesn't exist</h1>
  <p>The link may be old or mistyped. Your rounds are safe in the app.</p>
  <a class="btn" href="/">Back to Rounds</a>
</main>
</body>
</html>
